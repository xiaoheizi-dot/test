<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人博客</title>
    <link rel="icon" href="icon.ico" />
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="style_main.css" />
  </head>
  <body>
    <!-- 顶部标签 -->
    <header class="container-head">
      <nav>
        <h1>个人博客</h1>
        <a href="main.html">首页</a>
        <a href="#">文章</a>
        <a href="#">留言</a>
        <a href="#">站外链接</a>
        <a href="#">关于我</a>
        <a href="register.html">注册</a>
        <button class="skin-btn" id="skinBtn">夜间模式</button>
        <div class="avatar-box">
          <img src="../image/ColoredGlaze02-Dark.jpg" alt="头像" />
        </div>
      </nav>
    </header>
    <!-- 主体 -->
    <main class="container-layout">
      <!-- 左侧文章区域 -->
      <section class="feed">
        <div class="feed-header">
          <h2>用户名</h2>
          <h4 class="item-count"></h4>
        </div>
        <div class="search">
          <label>
            <h3>搜索</h3>
            <input type="text" id="searchBox" placeholder="输入标题关键词" />
            <button id="searchBtn">搜索</button>
            <button id="resetBtn">重置</button>
          </label>
        </div>
        <!-- 文章卡片 -->
        <div class="item"></div>
      </section>
      <!-- 右侧边栏 -->
      <aside class="sidebar">
        <div class="widget">
          <h3>关于我</h3>
          <p>前端爱好者，记录学习日常。</p>
        </div>
        <div class="widget">
          <h3>文章分类</h3>
          <ul>
            <li><a href="#">HTML/CSS</a></li>
            <li><a href="#">JavaScript</a></li>
            <li><a href="#">生活随笔</a></li>
          </ul>
        </div>
      </aside>
    </main>
    <script src="data.js"></script>
    <script src="render.js"></script>
  </body>
</html>
