<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文章详情 | 个人博客</title>
    <link rel="icon" href="icon.ico" />
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="style2.css" />
  </head>
  <body>
    <header class="container-head">
      <nav>
        <h1>个人博客</h1>
        <a href="主页.html">首页</a>
        <a href="#">文章</a>
        <a href="#">留言</a>
        <a href="#">站外链接</a>
        <a href="#">关于我</a>
        <button class="skin-btn" id="skinBtn">夜间模式</button>
        <div class="avatar-box">
      <img src="/image\ColoredGlaze02-Dark.jpg" alt="头像">
    </div>
      </nav>
    </header>

    <main class="container-layout">
      <section class="feed">
        <!-- 文章正文 -->
        <div class="article-content">
          <h2>第一篇博客文章</h2>
          <div class="post-info">发布时间：2026‑10‑14</div>
          <p>正文内容。</p>
        </div>
        <!-- 留言栏 -->
        <div class="comment-area">
                    <div class="comment-form">
                        <h3>发表留言</h3>
                        <input type="text" placeholder="请输入你的昵称">
                        <textarea placeholder="请输入留言内容"></textarea>
                        <button>提交留言</button>
                    </div>
                </div>
            </div>
      </section>
      <!-- 侧边栏 -->
      <aside class="sidebar">
        <div class="widget">
          <h3>关于我</h3>
          <p>前端爱好者，记录学习日常。</p>
        </div>
        <div class="widget">
          <h3>文章分类</h3> 
          <ul>
            <li><a href="#">HTML/CSS</a></li>
            <li><a href="#">JavaScript</a></li>
            <li><a href="#">生活随笔</a></li>
          </ul>
        </div>
      </aside>
    </main> 
    <script>
      skinBtn.addEventListener("click", () => {
        document.body.classList.toggle("night");
        skinBtn.textContent = document.body.classList.contains("night")
          ? "白天模式"
          : "夜间模式";
      });
    </script>
  </body>
</html>
